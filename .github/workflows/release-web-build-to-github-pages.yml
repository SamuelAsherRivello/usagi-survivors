name: ReleaseWebBuildToGitHubPages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install Usagi
        run: curl -fsSL https://usagiengine.com/install.sh | sh

      - name: Add Usagi to PATH
        run: echo "$HOME/.usagi/bin" >> "$GITHUB_PATH"

      - name: Build web export
        run: |
          usagi --version
          usagi export . --target web

      - name: Prepare GitHub Pages artifact
        run: unzip export/usagi-survivors-web.zip -d site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
